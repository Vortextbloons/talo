[package]
name = "talo"
version = "0.1.0"
edition = "2021"
description = "Talo Windows assistant host"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "=2.7.0"
tauri-plugin-notification = "=2.7.0"
tauri-plugin-single-instance = "=2.5.4"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
uuid = { version = "=1.18.1", features = ["v4"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
