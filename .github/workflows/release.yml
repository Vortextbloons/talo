name: release

# A version tag publishes a signed Windows installer and the update manifest that the app
# polls. Everything the app ships (Bun, Chromium, the bundled dependency graph) is prepared here,
# because the release build needs those directories to exist.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './apps/desktop -> target'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Vendor the runtime (Bun + pinned Chromium)
        run: bun run vendor

      - name: Build the workers and the shipped dependency graph
        run: bun run prepare:bundle

      - name: Verify the bundled worker boots
        run: bun run verify:bundle

      - name: Point the updater at this repository
        run: bun scripts/updater-endpoint.mjs

      - name: Check the signing key is present
        shell: bash
        run: |
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is empty. Add the updater private key as a repository secret."
            exit 1
          fi
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Check the Google OAuth client is present
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TALO_GOOGLE_OAUTH_JSON)) {
            throw 'TALO_GOOGLE_OAUTH_JSON is empty. Add the Google Desktop OAuth client JSON as a repository secret.'
          }
          try {
            $client = $env:TALO_GOOGLE_OAUTH_JSON | ConvertFrom-Json -ErrorAction Stop
          } catch {
            throw 'TALO_GOOGLE_OAUTH_JSON must contain the Google Desktop OAuth client JSON.'
          }
          if ([string]::IsNullOrWhiteSpace($client.installed.client_id)) {
            throw 'TALO_GOOGLE_OAUTH_JSON must contain installed.client_id from a Google Desktop OAuth client.'
          }
        env:
          TALO_GOOGLE_OAUTH_JSON: ${{ secrets.TALO_GOOGLE_OAUTH_JSON }}

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TALO_GOOGLE_OAUTH_JSON: ${{ secrets.TALO_GOOGLE_OAUTH_JSON }}
        with:
          projectPath: .
          tauriScript: bun run tauri
          # Both configs: the desktop config carries the resources and the public key, the
          # release config turns on updater artifacts so a .sig is written next to the setup.
          args: --config apps/desktop/tauri.conf.json --config apps/desktop/tauri.release.conf.json
          tagName: v__VERSION__
          releaseName: 'Talo v__VERSION__'
          releaseBody: |
            Talo for Windows (64-bit).

            Patch release fixing protected-tool scope grants, worker startup on MCP config failure, delegated transcript races, scheduler updates for deleted tasks, MCP cancellation, and Google sign-in packaging.

            See the [changelog](https://github.com/Vortextbloons/talo/blob/main/CHANGELOG.md) for details.
            Installed copies update themselves: Settings → Advanced → Updates.

            The DonSeTch corresponding source is published in this release as `donsetch-v4.10.1-source.tar.gz`.
          releaseDraft: false
          prerelease: false
          # Only NSIS is built, so the manifest must point at the setup.exe.
          updaterJsonPreferNsis: true
          retryAttempts: 2

      - name: Publish the DonSeTch corresponding source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          app_version=$(node -p "require('./package.json').version")
          source_version=$(node -p "require('./vendor/bundle/donsetch-manifest.json').version")
          asset="donsetch-v${source_version}-source.tar.gz"
          cp vendor/downloads/donsetch-source.tar.gz "$asset"
          gh release upload "v${app_version}" "$asset" --clobber
